<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>merapi merbabu</title>
  <style>
@font-face { font-family: 'rm';
src:
url('merapi-merbabu.ttf') format('truetype'),;
font-weight: normal;
font-style: normal;
}
    .aksara-font {
      font-family: 'rm', sans-serif;
      font-size: 24px;
      border: 1px solid #ccc;
      padding: 10px;
      min-height: 200px;
      margin: 20px auto;
      width: 80%;
      max-width: 800px;
      outline: none;
      background-color: white;
      text-align: center;
      line-height:2;
    }

    h1 {
      text-align: center;
      font-family: sans-serif;
      color: #333;
    }

    button, input{
      display: block;
      margin: 10px auto;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    .button-container {
      text-align: center;
      margin: 10px auto;
    }

    .button-container button {
      display: inline-block;
      margin: 5px;
    }

    label {
      display: block;
      text-align: center;
      margin-top: 10px;
    }

    .info-text {
      text-align: center;
      font-size: 12px;
      color: #666;
      margin-top: 5px;
      font-family: sans-serif;
    }
  </style>
</head>
<body>
  <h1>merpapi merbabu</h1>
  <label for="font-size">Ukuran Fon: <span id="font-size-value">24px</span></label>
  <input type="range" id="font-size" min="12" max="72" value="24">

  <div class="button-container">
    <button id="insert-zwnj">Masukkan ZWNJ</button>
    <button id="insert-nbsp">Masukkan NBSP</button>
  </div>
  <div class="info-text">ZWNJ: Zero Width Non-Joiner | NBSP: Non-Breaking Space</div>

  <div id="editor" contenteditable="true" class="aksara-font"></div>
  
  <button id="save-image">Simpan sebagai Gambar</button>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script>
    const editor = document.getElementById('editor');
    const fontSizeInput = document.getElementById('font-size');
    const fontSizeValue = document.getElementById('font-size-value');
    const insertZWNJButton = document.getElementById('insert-zwnj');
    const insertNbspButton = document.getElementById('insert-nbsp');

    // Muimpan dan memuat teks dari localStorage
    editor.innerText = localStorage.getItem('aksaraText') || '';

    editor.addEventListener('input', () => {
      localStorage.setItem('aksaraText', editor.innerText);
    });

    // Fungsi untuk menyisipkan teks pada posisi kursor
    function insertTextAtCursor(text) {
      const selection = window.getSelection();
      
      if (selection.rangeCount > 0) {
        const range = selection.getRangeAt(0);
        range.deleteContents();
        
        const textNode = document.createTextNode(text);
        range.insertNode(textNode);
        
        // Pindahkan kursor setelah teks yang disisipkan
        range.setStartAfter(textNode);
        range.setEndAfter(textNode);
        selection.removeAllRanges();
        selection.addRange(range);
      } else {
        // Jika tidak ada seleksi, tambahkan di akhir
        editor.focus();
        document.execCommand('insertText', false, text);
      }
      
      editor.dispatchEvent(new Event('input'));
    }

    // Fungsi untuk mendapatkan posisi kursor
    function getCaretPosition() {
      const selection = window.getSelection();
      if (selection.rangeCount === 0) return null;
      
      const range = selection.getRangeAt(0);
      const preCaretRange = range.cloneRange();
      preCaretRange.selectNodeContents(editor);
      preCaretRange.setEnd(range.endContainer, range.endOffset);
      
      return preCaretRange.toString().length;
    }

    // Tombol untuk menyisipkan ZWNJ (Zero Width Non-Joiner)
    insertZWNJButton.addEventListener('click', () => {
      insertTextAtCursor('\u200C'); // Karakter ZWNJ
    });

    // Tombol untuk menyisipkan NBSP (Non-Breaking Space)
    insertNbspButton.addEventListener('click', () => {
      insertTextAtCursor('\u00A0'); // Karakter Non-Breaking Space
    });

    // Simpan sebagai gambar
    document.getElementById('save-image').addEventListener('click', () => {
      html2canvas(editor, { scale: 3 }).then(canvas => {
        const imageURL = canvas.toDataURL('image/png');
        const link = document.createElement('a');
        link.href = imageURL;
        link.download = 'merapi-merbabu.png';
        link.click();
      });
    });

    // Kontrol ukuran font
    fontSizeInput.addEventListener('input', (event) => {
      const size = event.target.value;
      editor.style.fontSize = `${size}px`;
      fontSizeValue.textContent = `${size}px`;
    });

    // Fokus pada editor saat halaman dimuat
    window.addEventListener('load', () => {
      editor.focus();
    });
  </script>

</body>
</html>
